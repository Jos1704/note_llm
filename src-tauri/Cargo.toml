[package]
name = "md-notes"
version = "0.1.0"
edition = "2024"

[lib]
name = "md_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2"
toml = "1.2.1"
ureq = "2"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
