[package]
name = "md-notes"
version = "0.1.0"
edition = "2024"

[lib]
name = "md_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["macos-private-api", "protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2"
toml = "1.2.1"
ureq = "2"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-vision = "0.3"
objc2-application-services = "0.3"
